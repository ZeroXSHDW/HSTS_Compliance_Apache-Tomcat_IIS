name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bash syntax check
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking $script"
            bash -n "$script"
          done < <(find src/unix -type f -name '*.sh' -print0)

  unix-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run self-contained Unix HSTS tests
        run: |
          set -euo pipefail
          chmod +x tests/unix/test_hsts_unix.sh src/unix/UpdateTomcatHstsUnix.sh
          cd tests/unix
          ./test_hsts_unix.sh
