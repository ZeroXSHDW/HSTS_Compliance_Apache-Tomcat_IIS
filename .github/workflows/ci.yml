name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: hsts-compliance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bash-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check patch hygiene
        run: git diff --check
      - name: Bash syntax check
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking $script"
            bash -n "$script"
          done < <(find src/unix install/unix tests -type f -name '*.sh' -print0)

      - name: Credential hygiene contract
        run: bash tests/test_credential_hygiene.sh

  unix-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check patch hygiene
        run: git diff --check
      - name: Run self-contained Unix HSTS tests
        run: |
          set -euo pipefail
          chmod +x tests/unix/test_hsts_unix.sh src/unix/UpdateTomcatHstsUnix.sh
          cd tests/unix
          ./test_hsts_unix.sh

  powershell-parse:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check patch hygiene
        run: git diff --check
      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $parser = [System.Management.Automation.Language.Parser]
          $failures = @()
          Get-ChildItem -Path . -Recurse -File -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            $null = $parser::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $messages = ($errors | ForEach-Object { $_.Message }) -join '; '
              $failures += "$($_.FullName): $messages"
            }
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host 'All PowerShell scripts parsed successfully.'
