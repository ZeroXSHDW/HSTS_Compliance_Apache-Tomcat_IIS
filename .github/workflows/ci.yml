name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking $script"
            bash -n "$script"
          done < <(find src/unix -type f -name '*.sh' -print0)
